name: Merge automático

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: auto-merge-develop-main
  cancel-in-progress: false

jobs:
  merge:
    name: Validar e integrar PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar elegibilidade e executar merge
        uses: actions/github-script@v8
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const baseBranch = 'main';
            const headBranch = 'develop';
            const migrationRoot = 'metas-api/src/database/migrations/';
            const requiredJobs = ['Admin CI', 'Mobile CI', 'API CI', 'PostgreSQL Integration'];
            const terminalFailureConclusions = new Set([
              'cancelled',
              'failure',
              'startup_failure',
              'stale',
              'timed_out',
            ]);
            const waitIntervalMilliseconds = 15_000;
            const maxWaitAttempts = 32;
            const testedSha = process.env.TESTED_SHA;
            const ciWorkflowId = Number(process.env.CI_WORKFLOW_ID);
            const workflowRunId = Number(process.env.WORKFLOW_RUN_ID);
            const { owner, repo } = context.repo;

            const report = async (status, message) => {
              core.notice(message);
              await core.summary
                .addHeading('Resultado do merge automático')
                .addTable([
                  [
                    { data: 'Estado', header: true },
                    { data: 'Detalhe', header: true },
                  ],
                  [status, message],
                ])
                .write();
            };

            const delay = (milliseconds) =>
              new Promise((resolve) => setTimeout(resolve, milliseconds));

            if (
              !/^[0-9a-f]{40}$/u.test(testedSha) ||
              !Number.isSafeInteger(ciWorkflowId) ||
              !Number.isSafeInteger(workflowRunId) ||
              ciWorkflowId <= 0 ||
              workflowRunId <= 0
            ) {
              core.setFailed('Identificadores do workflow de CI são inválidos.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: workflowRunId,
              filter: 'latest',
              per_page: 100,
            });
            const jobConclusions = new Map(jobs.map(({ name, conclusion }) => [name, conclusion]));
            const invalidJobs = requiredJobs.filter((name) => jobConclusions.get(name) !== 'success');

            if (invalidJobs.length > 0) {
              core.setFailed(`Checks obrigatórios sem sucesso: ${invalidJobs.join(', ')}.`);
              return;
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: baseBranch,
              head: `${owner}:${headBranch}`,
              per_page: 100,
            });

            if (openPulls.length !== 1) {
              core.notice(
                `Merge não executado: esperado um PR develop → main aberto, encontrados ${openPulls.length}.`,
              );
              return;
            }

            const pullNumber = openPulls[0].number;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            const sameRepository = pull.head.repo?.full_name === `${owner}/${repo}`;
            const correctRoute = pull.head.ref === headBranch && pull.base.ref === baseBranch;
            const currentHeadWasTested = pull.head.sha === testedSha;

            if (
              pull.state !== 'open' ||
              pull.draft ||
              !sameRepository ||
              !correctRoute ||
              !currentHeadWasTested
            ) {
              await report(
                'IGNORADO_HEAD_DIVERGENTE',
                'Merge não executado: o PR atual não corresponde ao fluxo develop → main e ao SHA validados.',
              );
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const migrationPresent = files.some(({ filename }) => filename.startsWith(migrationRoot));

            if (migrationPresent) {
              await report(
                'BLOQUEADO_MIGRATION',
                'Migration detectada. Auto-merge bloqueado; o PR deve seguir o fluxo manual de banco.',
              );
              return;
            }

            let pullRequestCiRun = null;
            let readyPull = null;
            for (let attempt = 1; attempt <= maxWaitAttempts; attempt += 1) {
              const { data: currentPull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });

              if (currentPull.state !== 'open') {
                await report(
                  currentPull.merged ? 'IGNORADO_JA_INTEGRADO' : 'IGNORADO_PR_FECHADO',
                  `Merge não executado: o Pull Request #${pullNumber} não está mais aberto.`,
                );
                return;
              }
              if (currentPull.head.sha !== testedSha) {
                await report(
                  'IGNORADO_HEAD_ALTERADA',
                  'Merge cancelado: a HEAD do PR mudou durante a validação; o novo SHA exige seu próprio CI.',
                );
                return;
              }

              const pullRequestRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: ciWorkflowId,
                branch: headBranch,
                event: 'pull_request',
                head_sha: testedSha,
                per_page: 100,
              });
              pullRequestCiRun = pullRequestRuns
                .filter(
                  (run) =>
                    run.event === 'pull_request' &&
                    run.head_branch === headBranch &&
                    run.head_sha === testedSha,
                )
                .sort((left, right) => right.id - left.id)[0];

              if (
                pullRequestCiRun &&
                terminalFailureConclusions.has(pullRequestCiRun.conclusion)
              ) {
                await report(
                  'BLOQUEADO_CI_PR',
                  `Merge bloqueado: CI do PR para ${testedSha.slice(0, 7)} terminou como ${pullRequestCiRun.conclusion}.`,
                );
                return;
              }

              if (pullRequestCiRun?.conclusion === 'success') {
                const pullRequestJobs = await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  {
                    owner,
                    repo,
                    run_id: pullRequestCiRun.id,
                    filter: 'latest',
                    per_page: 100,
                  },
                );
                const pullRequestJobConclusions = new Map(
                  pullRequestJobs.map(({ name, conclusion }) => [name, conclusion]),
                );
                const invalidPullRequestJobs = requiredJobs.filter(
                  (name) => pullRequestJobConclusions.get(name) !== 'success',
                );

                if (invalidPullRequestJobs.length > 0) {
                  await report(
                    'BLOQUEADO_CHECK_OBRIGATORIO',
                    `Merge bloqueado: checks do PR sem sucesso: ${invalidPullRequestJobs.join(', ')}.`,
                  );
                  return;
                }

                if (currentPull.mergeable === true && currentPull.mergeable_state === 'clean') {
                  readyPull = currentPull;
                  break;
                }
                if (currentPull.mergeable === false || currentPull.mergeable_state === 'dirty') {
                  await report(
                    'BLOQUEADO_CONFLITO',
                    `Merge bloqueado: o Pull Request #${pullNumber} possui conflitos com ${baseBranch}.`,
                  );
                  return;
                }
              }

              if (attempt < maxWaitAttempts) {
                const ciState = pullRequestCiRun
                  ? `${pullRequestCiRun.status}/${pullRequestCiRun.conclusion ?? 'pending'}`
                  : 'ainda não criado';
                core.info(
                  `Aguardando CI do PR e mergeabilidade (${attempt}/${maxWaitAttempts}); CI=${ciState}; mergeable_state=${currentPull.mergeable_state ?? 'unknown'}.`,
                );
                await delay(waitIntervalMilliseconds);
              }
            }

            if (!readyPull) {
              const ciState = pullRequestCiRun
                ? `${pullRequestCiRun.status}/${pullRequestCiRun.conclusion ?? 'pending'}`
                : 'não encontrado';
              await report(
                'AGUARDANDO_REQUISITOS',
                `Merge não executado no intervalo limitado: CI do PR=${ciState}. Nenhum requisito foi ignorado.`,
              );
              return;
            }

            let unresolvedThreads = 0;
            let cursor = null;
            do {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`,
                { owner, repo, number: pullNumber, cursor },
              );
              const threads = result.repository.pullRequest.reviewThreads;
              unresolvedThreads += threads.nodes.filter(({ isResolved }) => !isResolved).length;
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (cursor);

            if (unresolvedThreads > 0) {
              await report(
                'BLOQUEADO_CONVERSAS',
                `Merge não executado: ${unresolvedThreads} conversa(s) ainda não resolvida(s).`,
              );
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (!repository.allow_merge_commit || repository.merge_commit_title !== 'PR_TITLE') {
              core.setFailed(
                'O repositório não está configurado para Merge com o título do Pull Request.',
              );
              return;
            }
            if (repository.delete_branch_on_merge) {
              core.setFailed(
                'O repositório está configurado para apagar branches após o merge; desabilite essa opção para preservar a develop.',
              );
              return;
            }

            const { data: currentPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (currentPull.state !== 'open' || currentPull.head.sha !== testedSha) {
              await report(
                'IGNORADO_HEAD_ALTERADA',
                'Merge cancelado: a HEAD do PR mudou depois das validações.',
              );
              return;
            }
            if (currentPull.mergeable !== true || currentPull.mergeable_state !== 'clean') {
              await report(
                currentPull.mergeable === false || currentPull.mergeable_state === 'dirty'
                  ? 'BLOQUEADO_CONFLITO'
                  : 'AGUARDANDO_REQUISITOS',
                `Merge não executado: estado atual do PR é ${currentPull.mergeable_state ?? 'desconhecido'}.`,
              );
              return;
            }

            const { data: merge } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              sha: testedSha,
              merge_method: 'merge',
            });

            if (!merge.merged) {
              core.setFailed(`O GitHub recusou o merge: ${merge.message}`);
              return;
            }

            await report(
              'MERGE_CONCLUIDO',
              `Pull Request #${pullNumber} integrado com sucesso por Merge commit.`,
            );
